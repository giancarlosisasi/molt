# molt's composite GitHub Action -- `uses: giancarlosisasi/molt@v1`.
#
# It lives at the repository root because that is what lets a workflow reference it as
# `owner/repo@ref` with no path, and because the action's ref is then a molt ref: the action and
# the CLI it drives cannot drift apart into separate release processes (change design D1).
#
# A *composite* action rather than a compiled JavaScript one: molt's action is the CLI it installs,
# so there is no bundled `dist/` to review and no second implementation to keep in step. Every step
# below is either the uv install, one line of git configuration, or `molt-action` itself.
#
# `action.yml` is a data file under test. `tests/action/test_action_yml.py` parses this file and
# asserts that every input has an option on the entry point, that the outputs are exactly the four
# documented names, that `runs.using` is composite, and that every `uses:` is pinned to a commit.
#
# Ported from `changesets/action` v1.9.0 `action.yml` and `src/index.ts` (read 2026-07-31): the
# input meanings, the token precedence (`index.ts:14-20`), the committer identity
# (`index.ts:39-46`) and the push credential (`index.ts:47-53`) -- the last one by a different
# route, an environment-scoped git credential helper rather than a `~/.netrc` file, for the reasons
# on the step itself. Not ported: the npm registry plumbing (`index.ts:75-115`); molt publishes
# over PyPI Trusted Publishing.
#
# The credential step is not optional and was once thought to be. Until 2026-08-02 this file said
# molt "pushes with the checkout's own credentials", which contradicted the `persist-credentials:
# false` that molt's own guide recommends: the first real run of the version phase died on
# `could not read Username for 'https://github.com'` after correctly computing the bump.
name: molt
description: >-
  Automate a Python release with molt: keep a "Version Packages" pull request in sync with pending
  changesets, then publish, tag and cut host releases when it merges.
author: Giancarlos Isasi

branding:
  icon: package
  color: purple

inputs:
  molt-version:
    description: >-
      The exact molt-release version to install, for example "0.1.0". Empty installs the latest
      release. Pinning is recommended: it is what keeps this action and the CLI it runs in
      lockstep between releases.
    required: false
    default: ""
  publish:
    description: >-
      The command that publishes the release, for example "molt publish". Leave it empty to run
      the version phase only -- supplying it is also what makes the publish phase reachable at all.
    required: false
    default: ""
  version-command:
    description: >-
      The command that versions the release, for example "molt version --snapshot canary". Empty
      runs molt's own "molt version". Named version-command rather than version because
      molt-version above already names a distribution pin.
    required: false
    default: ""
  title:
    description: The title of the release pull request.
    required: false
    default: Version Packages
  commit:
    description: >-
      The commit message molt writes on the release branch. Separate from the pull-request title,
      so a repository with a conventional-commit convention can rename one and keep the other.
    required: false
    default: Version Packages
  create-releases:
    description: >-
      Create one host release per published package, with that package's changelog entry as the
      body. "true" or "false". Switching it off does not change what is published.
    required: false
    default: "true"
  base-branch:
    description: >-
      The branch being released. The release branch is "changeset-release/<base-branch>" and the
      pull request targets it. Defaults to the branch the workflow is running on.
    required: false
    default: ${{ github.ref_name }}
  commit-mode:
    description: >-
      How the version commit reaches the remote. "git-cli" commits and force-pushes from the
      runner. "api" sends the changes to GitHub instead, so GitHub authors the commit, signs it
      with its own key and marks it verified -- which is what a branch protection rule requiring
      signed commits accepts. "api" buys the signature and nothing else: review requirements and
      required status checks still apply, and a commit made with the workflow's own token still
      does not start another workflow run. Upstream calls this input commitMode and spells the
      second value github-api; molt keeps git-cli and renames the other, because the host is not
      necessarily GitHub.
    required: false
    default: git-cli
  github-token:
    description: >-
      The token molt uses to open the pull request and create releases. Defaults to the workflow's
      own token. A GITHUB_TOKEN already in the environment wins over this input.
    required: false
    default: ${{ github.token }}

outputs:
  published:
    description: '"true" when at least one package was published this run.'
    value: ${{ steps.molt-action.outputs.published }}
  published_packages:
    description: A JSON array of {"name", "version"} objects for what went out.
    value: ${{ steps.molt-action.outputs.published_packages }}
  has_changesets:
    description: '"true" when the repository has pending changesets.'
    value: ${{ steps.molt-action.outputs.has_changesets }}
  pull_request_number:
    description: >-
      The number of the release pull request this run opened or updated. Empty when the run opened
      none, which is every publish run.
    value: ${{ steps.molt-action.outputs.pull_request_number }}

runs:
  using: composite
  steps:
    # Pinned to a commit, not to a tag: the action's own advice is to pin third-party actions, so
    # it holds itself to it. molt's release process owns this pin (openspec/GAPS.md CO-4).
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    # Ports `setupGitUser` (index.ts:39-46). A bare runner has no committer identity and the
    # version phase's commit would fail with git's own "please tell me who you are". Set only when
    # unset, so a workflow that configured its own keeps it.
    #
    # Skipped in `api` mode, where there is no local commit to attribute -- upstream's `setupUser`
    # returns early for the same reason (`git.ts:57-60`). Not tidiness: this step writes a GLOBAL
    # git identity onto the runner, so a workflow that runs molt and then does its own git work
    # would otherwise inherit a `github-actions[bot]` identity it never asked for.
    - name: Configure a committer identity
      if: inputs.commit-mode != 'api'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$(git config --get user.name || true)" ]; then
          git config --global user.name "github-actions[bot]"
        fi
        if [ -z "$(git config --get user.email || true)" ]; then
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        fi

    # Every input reaches the script through `env:`, never through a `${{ ... }}` interpolation
    # inside the shell line. An interpolated title containing a quote or a `$(...)` would be
    # executed by bash; an environment variable is data no matter what it holds.
    - name: Run molt's release loop
      id: molt-action
      shell: bash
      env:
        MOLT_ACTION_VERSION: ${{ inputs.molt-version }}
        MOLT_ACTION_PUBLISH: ${{ inputs.publish }}
        MOLT_ACTION_VERSION_COMMAND: ${{ inputs.version-command }}
        MOLT_ACTION_TITLE: ${{ inputs.title }}
        MOLT_ACTION_COMMIT: ${{ inputs.commit }}
        MOLT_ACTION_CREATE_RELEASES: ${{ inputs.create-releases }}
        MOLT_ACTION_BASE_BRANCH: ${{ inputs.base-branch }}
        MOLT_ACTION_COMMIT_MODE: ${{ inputs.commit-mode }}
        MOLT_ACTION_TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Token precedence, ported from index.ts:14-20: a GITHUB_TOKEN already in the environment
        # wins, so a workflow written before the input existed keeps working.
        export GITHUB_TOKEN="${GITHUB_TOKEN:-${MOLT_ACTION_TOKEN_INPUT}}"

        # Give git a push credential. Both phases push -- the version phase force-pushes the
        # release branch, the publish phase pushes the tags -- and `actions/checkout` with
        # `persist-credentials: false`, which molt's own guide recommends and every workflow here
        # uses, leaves the checkout with no way to authenticate one. Without this git falls through
        # to asking for a username on a runner that has no terminal, and reports it as
        # `could not read Username for 'https://github.com': No such device or address`.
        #
        # This is upstream's `.netrc` write (index.ts:47-53) reached by a different route. The token
        # is carried in the **environment**, not written to `~/.netrc`, to `~/.gitconfig` or onto
        # the remote URL: `GIT_CONFIG_COUNT` is read by every git this step spawns and by nothing
        # after it, so the token never lands on the runner's disk and no later step in the caller's
        # workflow inherits a credential it did not ask for. Scoped to this host, so it is offered
        # to no other remote, and appended after any git config the caller already put in the
        # environment rather than replacing it.
        #
        # Upstream reached the same place independently: `changesets/action` PR #670, "Avoid putting
        # the github token in the global `.netrc` file" (2026-06-24), deletes the `.netrc` write and
        # sets the same three environment variables. It writes `http.<server>/.extraheader` where
        # this writes a credential helper -- a base64 of the token in an environment variable, which
        # needs a `core.setSecret` call a composite cannot make. Expanding `${GITHUB_TOKEN}` when
        # git calls the helper keeps the value in the one variable Actions already masks.
        #
        # Two entries, not one: git *accumulates* credential helpers and takes the first answer, so
        # a runner image with a helper of its own would answer first. An empty value resets the
        # list, which is what makes molt's helper authoritative.
        if [ -n "${GITHUB_TOKEN}" ]; then
          molt_git_host="${GITHUB_SERVER_URL:-https://github.com}"
          molt_git_index="${GIT_CONFIG_COUNT:-0}"
          export "GIT_CONFIG_KEY_${molt_git_index}=credential.${molt_git_host}.helper"
          export "GIT_CONFIG_VALUE_${molt_git_index}="
          export "GIT_CONFIG_KEY_$((molt_git_index + 1))=credential.${molt_git_host}.helper"
          export "GIT_CONFIG_VALUE_$((molt_git_index + 1))=!f() { printf 'username=x-access-token\npassword=%s\n' \"\${GITHUB_TOKEN}\"; }; f"
          export GIT_CONFIG_COUNT=$((molt_git_index + 2))
        fi

        # An empty `molt-version` means "no `==` pin", not `molt-release==`.
        requirement="molt-release"
        if [ -n "${MOLT_ACTION_VERSION}" ]; then
          requirement="molt-release==${MOLT_ACTION_VERSION}"
        fi

        # `uvx --from` puts the ephemeral environment's bin directory on PATH for the child
        # process, so the `molt version` and `molt publish` commands the loop spawns resolve to
        # this same pinned install.
        uvx --from "${requirement}" molt-action \
          --publish "${MOLT_ACTION_PUBLISH}" \
          --version-command "${MOLT_ACTION_VERSION_COMMAND}" \
          --title "${MOLT_ACTION_TITLE}" \
          --commit-message "${MOLT_ACTION_COMMIT}" \
          --create-releases "${MOLT_ACTION_CREATE_RELEASES}" \
          --base-branch "${MOLT_ACTION_BASE_BRANCH}" \
          --commit-mode "${MOLT_ACTION_COMMIT_MODE}"
