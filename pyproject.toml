[project]
name = "molt-release"
version = "0.1.0"
description = "Changeset-driven versioning and changelogs for Python monorepos"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 spelling: `license` is an SPDX expression, `license-files` names the files that ship
# inside the sdist AND the wheel (`molt_release-<v>.dist-info/licenses/LICENSE`). The older
# `license = { text = "MIT" }` table form is deprecated and ships no licence text at all, which
# left every downloaded artifact claiming MIT and carrying none. PEP 639 also forbids pairing this
# with a `License :: OSI Approved :: MIT License` classifier -- do not add one back.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giancarlos Isasi" }]
keywords = ["changesets", "versioning", "monorepo", "changelog", "release", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    # PEP 440 / PEP 508 versions, specifiers, parsing, ordering and matching.
    # molt.versioning.ranges wraps it to pin the prerelease flag to the constraint's own
    # opt-in rather than PEP 440's resolver-oriented fallback; see roadmap/research/README.md 4.1.
    "packaging>=24.0",
    # CLI framework (owner's decision 2026-07-23, over the cyclopts recommendation; see
    # roadmap/tech-stack.md section 4). Typer is 0.x and can break between minors, so the
    # MoltGroup overrides in molt.cli are pinned by tests/cli/test_cli.py and uv.lock.
    "typer>=0.15",
    # Terminal rendering. Typer already depends on rich, but molt.ui.console imports it
    # directly, so it is declared rather than relied on transitively.
    "rich>=15",
    # Config validation. Reverses roadmap/tech-stack.md section 6's msgspec recommendation
    # (research README section 6): free JSON-Schema generation, AliasChoices for the
    # camelCase<->snake_case migration surface, and `.errors()` `loc` mapping 1:1 onto valibot's
    # `getDotPath`. Its import cost is paid only when a config is parsed -- molt.config exposes a
    # lazy facade so `molt --help` never touches it (design D2). >=2.11 for
    # `BeforeValidator(json_schema_input_type=...)`, which is what lets the generated schema
    # advertise the written shorthands while the model stays normalized.
    "pydantic>=2.11",
    # TOML write path (tech-stack.md section 8). `tomllib` stays the read path -- it cannot write,
    # and a tomllib read + naive writer deletes every comment in a hand-maintained
    # `pyproject.toml`. tomlkit round-trips the document losslessly; molt.apply.edit_toml pays its
    # cost only on the handful of manifests a release actually rewrites.
    "tomlkit>=0.13",
    # Changeset frontmatter. Chosen over PyYAML because molt.changeset.parse pins it to YAML 1.2
    # with duplicate keys rejected, and that pairing is what makes the frontmatter agree with
    # upstream's `yaml@2`: PyYAML is YAML 1.1, so it reads `yes` as a boolean, and it lets a package
    # duplicated by a merge conflict win in silence. Research doc 02 section 12.3 names it.
    "ruamel-yaml>=0.18",
    # Changelog templating, both layers: the per-line token engine that replaces changesets'
    # bespoke `{token}` regex, and the molt-native entry template that answers changesets issue
    # #109 (open 7 years, PR waiting 6). Research README section 5 item 5 prices real changelog
    # templating at exactly one library; a hand-rolled mini-language would need its own grammar,
    # error messages and tests and still be less capable than what users already know. Both
    # environments run with `StrictUndefined` and autoescaping OFF -- the output is Markdown, not
    # HTML, so escaping a summary's `<` or `&` would corrupt it.
    "jinja2>=3.1",
    # The forge and PyPI HTTP client (tech-stack.md section 8). One client for both, chosen over
    # `requests` and over the stdlib: `respx` mocks it at the transport layer, which is what lets
    # `tests/forge` and `tests/publish` assert the query molt actually sends and the header it
    # actually attaches without a real network. `molt.forge` hand-writes its GraphQL over it -- no
    # GraphQL client library and no Octokit-equivalent (change 12 design, Non-Goals). Importing it
    # is not free, so `molt.forge` is on `tests/cli/test_cli.py::HEAVY_MODULE_PREFIXES` and a
    # command imports the forge inside `run()`.
    "httpx>=0.28",
    # Interactive prompts (roadmap/tech-stack.md section 5, owner ruling 2026-08-01). Chosen over
    # InquirerPy (dead since 2022-06), `rich.prompt` (no multiselect, which `molt add`
    # fundamentally requires) and textual (a whole framework for five questions). Built on
    # `prompt_toolkit`, so importing it is expensive: `src/molt/ui/prompts.py` is the ONLY module
    # that names it and it imports it inside each method body, never at module scope, because
    # `src/molt/cli.py` imports `molt.ui.prompts` at module scope and every `molt --help` would
    # otherwise pay for the terminal framework. Pinned by
    # `tests/cli/test_prompts.py::test_importing_the_cli_loads_neither_questionary_nor_prompt_toolkit`.
    "questionary>=2.1",
    # The external-editor primitive (`click.edit`, research doc 03 section 11.2). Already installed
    # as a Typer dependency, so this downloads nothing -- it declares what molt now imports
    # directly. `click.edit` resolves $VISUAL/$EDITOR, falls back per platform and round-trips the
    # temp file, which is the whole matrix molt would otherwise re-implement and under-test on
    # Windows; upstream's `launch-editor` sniffing is deliberately not ported.
    "click>=8.1",
]

[project.scripts]
# The distribution is `molt-release` but the command users type is `molt`. Two shorter names are
# unavailable: `molt` is squatted on PyPI by a dead 2012 project, and `molt-cli` is refused on
# upload because PyPI deletes `-`, `_` and `.` before comparing names, which collides it with the
# active `moltcli`. See roadmap/tech-stack.md §1 -- it carries PyPI's comparison function, which is
# what any future rename must be checked against.
molt = "molt.cli:main"
# The CI entry point the composite action runs (`action.yml`). Deliberately a SECOND console
# script rather than a `molt` verb: `tests/cli/test_cli.py::test_help_lists_every_command_in_the_table`
# asserts the registered command set equals a frozen tuple, and `molt --help` is a documented
# product surface that should not grow a verb only a CI runner types (change design D2). `uvx`
# puts this on `PATH` beside `molt`, so the version and publish commands the loop spawns resolve
# to the same pinned install. Requires `uv sync` after this edit before the script exists in the
# environment.
molt-action = "molt.action.cli:main"

[project.entry-points."molt.commit"]
# The default commit-message convention (`add` + `version` messages), registered as an entry point
# so a project can substitute its own without forking molt -- mirrors the `molt.changelog`
# generator mechanism. The value names the module itself: `get_add_message` / `get_version_message`
# module attributes already are the whole plugin surface, so there is no wrapper object to point
# at. Requires `uv sync` (or `uv sync --reinstall-package molt-release`) after this edit before
# `importlib.metadata.entry_points(group="molt.commit")` sees it.
default = "molt.commit"

[project.entry-points."molt.changelog"]
# molt's two built-in changelog generators, registered through the *same* mechanism a third-party
# generator uses (design D1). If the built-ins were special-cased by name in code, the plugin path
# would be the only untested one; registering them here means every `molt version` run exercises
# the extension seam. Each value names the module-level `generator` object, which is the attribute
# every resolution form in `molt.apply.generators` looks for.
#
# Requires `uv sync` (or `uv sync --reinstall-package molt-release`) after this edit before
# `importlib.metadata.entry_points(group="molt.changelog")` sees it -- importlib reads INSTALLED
# distribution metadata, not this file.
git = "molt.changelog.git:generator"
github = "molt.changelog.github:generator"
# The name `molt.config`'s `BUILTIN_CHANGELOG` ("molt.changelog.default") resolves to once the
# group prefix is stripped -- the same shape `[project.entry-points."molt.commit"] default` has,
# and the reason both defaults reach their built-in through the *plugin* mechanism rather than
# through a privileged branch in the loader. An alias for `git`, deliberately: "the default
# changelog generator" and "the git changelog generator" are the same object, so a project can
# name either and get the same bytes.
default = "molt.changelog.git:generator"

[project.entry-points."molt.version_source"]
# Where a package's version lives -- molt's three built-in sources, registered through the *same*
# mechanism a third-party source uses (version-sources design D8, the rule `molt.changelog` above
# already follows). A source molt does not ship becomes usable by installing it and naming its kind
# in `[tool.molt.version_source]`; naming one that is not installed fails with a message listing
# the ones that are.
#
# Each value names the module, whose `build(*, name, directory, version, options)` callable is what
# `molt.ecosystem.version_sources.resolve` looks for.
#
# Requires `uv sync` (or `uv sync --reinstall-package molt-release`) after this edit before
# `importlib.metadata.entry_points(group="molt.version_source")` sees it -- importlib reads
# INSTALLED distribution metadata, not this file.
static = "molt.ecosystem.version_sources.static"
file = "molt.ecosystem.version_sources.file"
# Detected and REFUSED, not released: there is nothing on disk to write, because the tag *is* the
# version. The change that lifts the refusal is named and committed --
# `implement-tag-version-injection` (owner ruling 2026-08-01) -- and its design starts from this
# change's design D6, which is in `molt/ecosystem/version_sources/tag.py`'s docstring.
tag = "molt.ecosystem.version_sources.tag"

[project.urls]
Homepage = "https://github.com/giancarlosisasi/molt"
Repository = "https://github.com/giancarlosisasi/molt"
Documentation = "https://molt.gio-labs.com"
Issues = "https://github.com/giancarlosisasi/molt/issues"

[build-system]
# >=1.27 is the floor for PEP 639: earlier hatchling rejects the `license = "MIT"` string form and
# ignores `license-files`. Unpinned, a stale build environment silently falls back to metadata 2.3
# and the licence never reaches the wheel.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# An sdist holds what is needed to rebuild and test the package, and nothing else. Hatchling's
# default is "everything the VCS does not ignore", and `website/` is not ignored: measured
# 2026-08-01, the unfiltered sdist was 24.8 MB carrying `website/node_modules` (3,175 files) and
# `website/doc_build`. This is an allow-list, so a new top-level directory does NOT ship until it
# is named here.
#
# `uv build` builds the wheel FROM the sdist, so anything missing from this list is missing from
# the wheel too -- `src/molt` is load-bearing, not decorative. `tests` is included so a
# distro packager can run the suite from the sdist alone; `uv.lock` so the dev environment is
# reproducible from it; `action.yml` because the composite GitHub Action is part of the product.
#
# **Every pattern is anchored with a leading `/`.** These are gitignore-style globs: an unanchored
# `README.md` matches at ANY depth, which pulled 148 `website/node_modules/**/{README.md,LICENSE}`
# files back into the sdist even with `website/` unlisted. The leading slash pins each pattern to
# the project root.
include = [
    "/src/molt",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/action.yml",
]

[tool.hatch.build.targets.wheel]
# Hatchling ships every file under this directory, not only the `.py` ones, which is what puts
# `molt/changelog/templates/default-entry.md.jinja` -- the default changelog entry template -- in
# the wheel. Do not add an include/exclude filter here without re-checking that asset: a missing
# template fails at `molt version` time, in a user's repo, and never during a test run.
packages = ["src/molt"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "pyrefly>=1.1",
    # Test infrastructure for the engine/forge/publish suites (research doc 07 §4/§5).
    "syrupy>=5.5", # snapshot tests: release plans, changelogs, GraphQL queries
    "respx>=0.22", # httpx mocking for the forge (GitHub GraphQL) + PyPI JSON API
    # tomlkit is no longer listed here: the tmp_project workspace builder shares it with
    # molt.apply.edit_toml, which made it a runtime dependency above.
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# The repo root, so shared test-only helpers resolve as `tests.<pkg>.<module>` (the same dotted
# path pytest's `pythonpath` setting below makes importable). Without this pyrefly's only import
# root is `src`, and every `from tests...` line needs a missing-import suppression.
search-path = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import-mode=importlib lets same-named test modules coexist across packages
# (e.g. tests/apply/test_deliberately_not_ported.py and tests/changelog/...) without
# __init__.py files or the legacy "import file mismatch" collection error.
addopts = "-q --import-mode=importlib"
# import-mode=importlib does not put the test directories on sys.path, so shared test-only helper
# modules (e.g. tests/engine/fake_state.py) are imported via their full dotted path from the repo
# root: `from tests.engine.fake_state import FakeFullState`.
pythonpath = ["."]
# Test-type markers. The milestone map (roadmap/research/test-suite/MILESTONES.md) uses these so
# /opsx:propose can pick a build-order step's conformance gate by kind, e.g. `-m "unit or property"`.
markers = [
    "unit: pure in-memory logic; no filesystem, subprocess, or network",
    "functional: a command/function exercised end-to-end over a tmp workspace (tmp_project), no external processes",
    "integration: spawns real external tools via subprocess (git, python -m build)",
    "e2e: full pipeline against a fake index or the action loop",
    "property: hypothesis-driven invariant test",
    "snapshot: syrupy snapshot assertion",
    "not_ported: changesets behavior molt deliberately does NOT port; kept skipped as an audit record",
    "network: uses mocked HTTP (respx) for the forge or PyPI; never hits the real network",
    "git: requires the real git binary via the git_repo fixture",
    "slow: expensive test excluded from the fast default loop",
]

[tool.coverage.run]
source = ["src/molt"]
