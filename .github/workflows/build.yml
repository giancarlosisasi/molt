# The pull-request gate: two jobs, neither of which uploads anything.
#
#   build      -- lint, types, tests, and a build proven installable. It also produces the artifact
#                 release-testpypi.yml uploads, through `workflow_call`.
#   changeset  -- every pull request that changes what ships must say what it releases.
#
# It is no longer the source of the artifact that reaches PyPI. `molt publish`, driven by the
# composite action in release.yml, builds its own from the merged tree. What this job proves is that
# the tree builds, installs and passes, which is what a release is allowed to be cut from.
#
# Nothing here contacts an index and nothing here needs a secret or an OIDC token, so it runs
# unchanged on a pull request from a fork. Everything that can authenticate lives in release.yml
# and release-testpypi.yml.
name: build

on:
  pull_request:
  push:
    branches: [main]
  # Lets release-testpypi.yml reuse the build job. A reusable workflow cannot itself be named in a
  # PyPI Trusted Publisher configuration, which is why the workflow that publishes writes out its
  # own upload step rather than sharing one from here.
  workflow_call:

# No permission by default. Each job re-grants the one thing it needs.
permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, never a release run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Every third-party action is pinned to a commit, not a tag: a tag can be moved to point at
      # different code. Dependabot's github-actions ecosystem (.github/dependabot.yml) refreshes
      # these pins weekly, so the pin does not go stale.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so no credential is written into .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails the run if uv.lock does not match pyproject.toml, which is the same check a
      # contributor gets locally. The dev dependency group installs by default.
      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run pyrefly check

      - name: Test
        run: uv run pytest

      # --no-sources builds with [tool.uv.sources] switched off, so the package resolves from a
      # real index the way a user's machine will. uv builds the wheel FROM the sdist, so a file
      # missing from the sdist filter in pyproject.toml is missing from the wheel too.
      - name: Build the sdist and the wheel
        run: uv build --no-sources

      # The same check PyPI applies to the long description before it accepts an upload. --strict
      # turns its warnings into failures, which is what catches a description that would render
      # broken on the project page. PyPI has no way to edit a description after the fact.
      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # A tripwire for a broken [tool.hatch.build.targets.sdist] filter, not a size budget. The
      # unfiltered sdist was 24.8 MB: it shipped website/node_modules, 3,175 files. The filtered
      # one is under 400 KB.
      - name: Refuse an oversized sdist
        run: |
          size=$(stat -c%s dist/*.tar.gz)
          echo "sdist: $size bytes"
          if [ "$size" -gt 5000000 ]; then
            echo "::error::sdist is $size bytes; the sdist filter in pyproject.toml is not applying"
            exit 1
          fi

      # Installs the built wheel into a throwaway environment with no project on the path. It is
      # the closest thing CI has to a stranger running `uvx --from molt-release molt --version`,
      # and it proves the console script and the packaged changelog template both survived the
      # build.
      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl -- molt --version

      # There is no tag/version check here any more. Releases are no longer started by a hand-pushed
      # tag: molt computes the version from the changesets and creates the tag itself, after the
      # upload succeeds, so the two cannot disagree.

      - name: Upload the distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # molt's own changeset gate, run with the molt in this checkout rather than an installed one. A
  # pull request that changes what ships must declare the release it needs, which is what keeps the
  # "Version Packages" pull request an accurate account of the next version.
  #
  # `changed_file_patterns` in pyproject.toml decides what counts: src/, pyproject.toml, action.yml
  # and README.md. A pull request that only touches website/, tests/ or .github/ passes untouched.
  # For a change that really does ship nothing, `molt add --empty` records that in one line.
  changeset:
    name: a changeset covers what changed
    # Pull requests only, and never the release pull request. On a push to main the changesets have
    # already served their purpose, and release.yml is what reads them next.
    #
    # On `changeset-release/<base>` the gate contradicts itself. That branch is molt's own output:
    # the version phase deletes the changesets it consumed and bumps `pyproject.toml`, which is a
    # `changed_file_patterns` match. So "a package changed and no changeset covers it" is the
    # correct shape of a release pull request, not a fault in it, and the gate failed every one of
    # them. The rule the gate enforces is about authored changes, so it applies to authored
    # branches. The name is derived from the base branch rather than written out, because that is
    # how molt derives it too (`molt.action.run.VERSION_BRANCH_PREFIX`).
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref != format('changeset-release/{0}', github.base_ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `molt status --since` resolves a ref on the base branch, so the base branch has to be
          # in the clone. The default shallow single-branch fetch does not include it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --locked

      # Exits 1 when a versionable package changed and no changeset covers it, naming the fix.
      - name: Check for a changeset
        run: uv run molt status --since origin/${{ github.base_ref }}
