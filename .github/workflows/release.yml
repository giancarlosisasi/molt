# molt releases molt.
#
# This workflow runs molt's own composite action (`giancarlosisasi/molt-action`) against this
# repository. It is the dogfood: the release loop molt documents is the release loop molt uses, so
# a bug in it is one we hit before anyone else does.
#
# The loop has two phases and molt picks which one runs:
#
#   Pending changesets exist -> VERSION. Open or update the "Version Packages" pull request on
#                               `changeset-release/main`. Nothing is published.
#   No pending changesets    -> PUBLISH. Build, upload to PyPI over Trusted Publishing, push a
#                               `v<version>` tag, and cut a GitHub Release. This is the state right
#                               after the "Version Packages" pull request merges.
#
# So merging the "Version Packages" pull request IS the release. There is no tag to push by hand;
# molt creates the tag itself, after the upload succeeds.
#
# ---------------------------------------------------------------------------------------------
# Two jobs, not one, and why
# ---------------------------------------------------------------------------------------------
# The action picks its own phase, so one job would work. It is split because the `pypi` environment
# carries a required reviewer: with one job, EVERY push to main would sit waiting for an approval it
# does not need, including the pushes that only refresh the release pull request. Splitting on the
# action's own `has_changesets` output puts the approval on the publish and nowhere else, and keeps
# `id-token: write` off the job that never uploads. This is the stricter setup
# `website/docs/guide/ci-github-action.mdx` recommends.
#
# ---------------------------------------------------------------------------------------------
# What PyPI trusts
# ---------------------------------------------------------------------------------------------
# The Trusted Publisher on PyPI is bound to this repository, THIS FILENAME, and the `pypi`
# environment. That is why the file kept the name `release.yml` when it stopped being tag-driven:
# renaming it revokes publishing until
# https://pypi.org/manage/project/molt-release/settings/publishing/ is changed to match.
#
# The `pypi` environment's deployment rule must allow the **branch `main`**. It was a tag rule
# (`v*.*.*`) while this workflow was tag-driven, and a tag rule blocks every run of this one.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  # One release at a time. The version phase force-updates `changeset-release/main`, so two runs
  # doing that at once would race, and a publish must never be cancelled half-way.
  group: release-pypi
  cancel-in-progress: false

jobs:
  version:
    name: keep the release pull request in sync
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update "Version Packages"
    outputs:
      # "true" when changesets are pending. The publish job reads it to decide whether this push is
      # a release. A failed job leaves it empty, which is not "false", so a broken version phase can
      # never fall through into an upload.
      has_changesets: ${{ steps.molt.outputs.has_changesets }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # molt reads history to decide which packages changed and which commit a changeset came
          # from. A shallow clone gives it neither.
          fetch-depth: 0
          # The action supplies its own push credential, from the GITHUB_TOKEN passed below, for
          # the length of its own step. So the checkout leaves none in .git/config: nothing molt
          # runs needs one, and no later step in this workflow inherits one it did not ask for.
          persist-credentials: false

      # The action is `giancarlosisasi/molt-action`, its own repository since 2026-08-03. This
      # workflow used to say `uses: ./` and read the `action.yml` at this repository's root, which
      # bought a real thing: a change to the action was exercised by the pull request that made it.
      # That is gone, and the replacement lives next door -- `molt-action`'s own CI resolves
      # `action.yml`'s inputs against an installed `molt-release` on every push and once a week.
      #
      # Pinned to a commit, like every other `uses:` in this repository, because that is the advice
      # molt's own documentation gives. Dependabot refreshes it.
      #
      # Neither job passes `molt-version`, which is the input's own default and means "the newest
      # molt-release on PyPI". That is a different pin from the `uses:` above: this one names the
      # CLI, that one names the YAML a runner executes.
      #
      # molt's guide tells its users to pin the CLI, and this workflow deliberately does not,
      # because a project releasing itself has the opposite failure. A pin here has to be edited by
      # hand in the same pull request as every release, forgetting is silent, and forgetting it is
      # what shipped 0.1.0 through 0.1.3 with no GitHub Release at all: the fix was on PyPI and the
      # workflow kept installing the version that predated it.
      #
      # The risk this takes on is the other direction -- a release that breaks the release loop
      # becomes the tool that has to cut its own fix. The way out is to add `molt-version` back
      # naming the last version that worked, ship the fix, and delete the line again.
      #
      # This job passes no `publish` input either, so it can only ever run the version phase.
      - name: Run the molt release loop
        id: molt
        uses: giancarlosisasi/molt-action@9127d48ea955a62c707d7cf82f001e3f05c0523c # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish to PyPI
    needs: version
    # Only when the version phase found nothing left to version, which is the push that merged the
    # "Version Packages" pull request.
    if: needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/molt-release/
    permissions:
      contents: write # push the version tag, create the GitHub Release
      id-token: write # the OIDC token PyPI exchanges for a 15-minute upload token
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Same as the version job: the action carries its own credential for the tag push.
          persist-credentials: false

      - name: Publish, tag and cut the release
        id: molt
        uses: giancarlosisasi/molt-action@9127d48ea955a62c707d7cf82f001e3f05c0523c # v1
        with:
          # No `molt-version` here either -- see the version job on why this workflow tracks the
          # newest release rather than pinning one.
          #
          # Supplying `publish` is what makes the publish phase reachable at all.
          publish: molt publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
