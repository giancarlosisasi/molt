# Publishes molt-release to PyPI over Trusted Publishing.
#
# There is no API token in this repository and no secret for this job to read. PyPI trusts an
# OpenID Connect token that GitHub mints for this workflow, and exchanges it for an upload token
# that lives fifteen minutes.
#
# PyPI binds that trust to four values: the repository owner, the repository name, THIS FILENAME,
# and the environment name below. All four are part of the credential. Renaming this file or the
# `pypi` environment revokes publishing until the configuration at
# https://pypi.org/manage/project/molt-release/settings/publishing/ is changed to match.
#
# The publish job is written out here rather than shared with release-testpypi.yml because a
# reusable workflow cannot be the workflow in a Trusted Publisher configuration
# (https://docs.pypi.org/trusted-publishers/troubleshooting/). Only the build is shared.
#
# A refused publish is almost always a claim that does not match. Compare owner, repository name,
# workflow filename and environment name against the PyPI page above, character for character:
# https://docs.pypi.org/trusted-publishers/troubleshooting/
name: release

on:
  push:
    tags:
      # PEP 440 releases and prereleases alike: v0.1.1, v0.2.0rc1, v1.0.0a2.
      - "v[0-9]+.[0-9]+.[0-9]+*"

# There is deliberately no workflow_dispatch. One tag is one release, and a PyPI version can never
# be replaced or reused. A publish that fails after the build is re-run from the run page with
# "Re-run failed jobs", which keeps the tag as the only thing that starts a release.

permissions: {}

concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  # Lints, type-checks, tests, builds, checks the metadata, smoke-tests the wheel, and refuses a
  # tag that disagrees with [project].version.
  build:
    uses: ./.github/workflows/build.yml
    # A called workflow can only lower the permissions it is handed, never raise them, and the
    # workflow-level default above is none. Without this line build.yml's own `contents: read`
    # reads as an elevation and the run fails before the checkout.
    permissions:
      contents: read

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Create this environment under Settings -> Environments and add yourself as a required
      # reviewer. The run then waits for a click before the upload, which is the only point in the
      # process where an unwanted release can still be stopped.
      name: pypi
      url: https://pypi.org/project/molt-release/
    permissions:
      # The only permission Trusted Publishing needs. Granted per job, never at workflow level: any
      # job holding it can mint an OIDC token that identifies this repository to PyPI.
      id-token: write
    steps:
      - name: Download the distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # The defaults are what this release wants: PyPI as the index, dist/ as the source, and PEP
      # 740 attestations generated and uploaded. skip-existing stays off, so an attempt to publish
      # a version that is already on PyPI fails loudly instead of passing in silence.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
