# Rehearses the release against TestPyPI, over Trusted Publishing.
#
# TestPyPI is a separate site with a separate account database and a separate set of trusted
# publishers. Configure this workflow at https://test.pypi.org/manage/account/publishing/, not on
# pypi.org, and use the `testpypi` environment name below.
#
# Run it by hand from the Actions tab when the packaging changes: the sdist filter, the entry
# points, the build backend, the long description, the project metadata. It is not a staging
# channel for alpha and beta versions. Those are PEP 440 prereleases and they belong on real PyPI,
# where pip and uv hide them from anyone who did not ask for --pre.
#
# Installing from TestPyPI needs PyPI as a second index, because TestPyPI does not carry molt's
# dependencies:
#
#   uv pip install --default-index https://test.pypi.org/simple/ \
#                  --index https://pypi.org/simple/ molt-release
name: release-testpypi

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-testpypi
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # A called workflow can only lower the permissions it is handed, never raise them, and the
    # workflow-level default above is none.
    permissions:
      contents: read

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/molt-release/
    permissions:
      id-token: write
    steps:
      - name: Download the distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a rehearsal target, not a record, and a rehearsal is often run twice on the
          # same version. A file that is already there is skipped rather than failing the run.
          # release.yml does not set this: on PyPI a duplicate must be loud.
          skip-existing: true
